# Vitrine ACQUISITOR (Worker « acquisitor-vitrine », acquisitor.fr).
name = "acquisitor-vitrine"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
no_bundle = true
find_additional_modules = true
base_dir = "src"
rules = [
  { type = "Text", globs = ["**/*.html"], fallthrough = false },
  { type = "ESModule", globs = ["**/*.js"], fallthrough = false },
]

routes = [
  { pattern = "acquisitor.fr", custom_domain = true },
  { pattern = "www.acquisitor.fr", custom_domain = true },
]

# Liste d'attente (inscriptions de la page d'accueil)
[[kv_namespaces]]
binding = "LISTE"
id = "b1d42f3276524237839ec6fc2f6bc53c"

[triggers]
crons = []

# Comptages issus de la base officielle des entreprises (préparés par donnees/preparer.py)
[[kv_namespaces]]
binding = "DONNEES"
id = "9af436fb43c54e26b9ba815f9881a116"

[[d1_databases]]
binding = "BASE"
database_name = "acquisitor-base"
database_id = "150c1770-2f2c-4e05-85d4-3f4c4ab569eb"
