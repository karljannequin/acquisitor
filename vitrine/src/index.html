<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%231E5EFF'/%3E%3Ccircle cx='226' cy='226' r='110' fill='none' stroke='%23fff' stroke-width='44'/%3E%3Cpath d='M310 310l92 92' stroke='%23fff' stroke-width='44' stroke-linecap='round'/%3E%3C/svg%3E">
<title>ACQUISITOR · Aucun contact ne lui échappe</title>
<meta name="description" content="ACQUISITOR trouve les bons clients, leur écrit au bon moment et suit chaque réponse. Bientôt disponible.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@700;800&display=swap">
<style>
/* Page d'accueil : un seul écran, comme controlator.fr. Plan de métro → loupe → logo. Thème clair unique. */
:root{--ink:#0E1A33;--muted:#5E6A85;--blue:#1E5EFF;--blue-light:#A8C2FF;--line:#E3E8F2;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;background:#fff;color:var(--ink)}
body{margin:0;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,20px);padding:24px max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px));cursor:default}
svg{width:min(900px,100%);height:auto;max-height:72vh;display:block}
.line{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.5s cubic-bezier(.6,.1,.3,1) forwards}
.st{opacity:0;animation:pop .35s ease-out forwards;transform-box:fill-box;transform-origin:center}
.lbl{opacity:0;animation:fade .4s ease-out forwards}
.hit{opacity:0;transition:opacity .3s}.hit.on{opacity:1}
.word{opacity:0;transition:opacity .35s}.word.on{opacity:1}
.word .wt{opacity:0;transition:opacity .6s ease .35s}.word.on .wt{opacity:1}
.word .tg{opacity:0;transition:opacity .6s ease .8s}.word.on .tg{opacity:1}
.sub{max-width:44ch;margin:0;text-align:center;font-size:clamp(15px,2vw,18px);line-height:1.55;color:var(--muted);opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
.sub b{color:var(--blue);font-weight:700}
.sub.on{opacity:1;transform:none}
footer{position:fixed;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;gap:12px;font:600 11px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.line,.st,.lbl{animation:none;opacity:1;stroke-dashoffset:0}}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="ACQUISITOR">
  <svg viewBox="0 0 1000 620" role="img" aria-label="Une loupe parcourt les villes et trouve des contacts, puis le logo ACQUISITOR apparaît">
    <defs><clipPath id="lensclip" clipPathUnits="userSpaceOnUse"><circle id="lensc" cx="-200" cy="-200" r="78"/></clipPath></defs>
    <g id="mapg"></g>
    <g id="hits"></g>
    <g id="lens" style="opacity:0;transition:opacity .3s">
      <circle id="lensbg" cx="-200" cy="-200" r="78" fill="#fff"/>
      <g clip-path="url(#lensclip)"><use id="lensuse" href="#mapg"/></g>
      <circle id="lensring" cx="-200" cy="-200" r="78" fill="none" stroke="#1E5EFF" stroke-width="7"/>
      <line id="lenshandle" x1="0" y1="0" x2="0" y2="0" stroke="#1E5EFF" stroke-width="16" stroke-linecap="round"/>
    </g>
    <circle id="eraser" cx="500" cy="216" r="0" fill="#fff"/>
    <g class="word" id="word">
      <rect x="462" y="178" width="76" height="76" rx="20" fill="#1E5EFF"/>
      <circle cx="495" cy="211" r="17" fill="none" stroke="#fff" stroke-width="7"/>
      <path d="M508 224l13 13" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <text class="wt" x="500" y="334" text-anchor="middle" style="font:800 64px Sora,Manrope,sans-serif;letter-spacing:6px" fill="#0E1A33">ACQUISITOR</text>
      <text class="tg" x="500" y="378" text-anchor="middle" style="font:600 20px Manrope,sans-serif" fill="#1E5EFF">Aucun contact ne lui échappe</text>
    </g>
  </svg>
  <p class="sub" id="sub">Il trouve les bons clients, leur écrit au bon moment et suit chaque réponse. Une base de contacts qui grandit chaque nuit. <b>Bientôt.</b></p>
</main>
<footer><span>© 2026 ACQUISITOR</span><span>acquisitor.fr</span></footer>

<script>
(()=>{
const $=s=>document.querySelector(s);
const CITIES={'Vendôme':[47.793,1.066],'Blois':[47.586,1.335],'Tours':[47.394,0.684],'Le Mans':[48.006,0.199],'Orléans':[47.903,1.909],'Châteaudun':[48.071,1.338],'Montoire':[47.753,0.865],'Saint-Calais':[47.921,0.745],'Romorantin':[47.359,1.741],'Mer':[47.704,1.507],'Château-Renault':[47.594,0.912],'Morée':[47.903,1.234],'Selommes':[47.756,1.192],'Savigny':[47.879,0.810],'Amboise':[47.412,0.982],'Chartres':[48.446,1.489]};
const P=c=>{const[la,lo]=CITIES[c];return[90+(lo-0.1)/1.9*820,60+(48.52-la)/1.22*500]};
const LINES=[['Le Mans','Saint-Calais','Savigny','Vendôme','Morée','Châteaudun','Chartres'],['Tours','Château-Renault','Vendôme','Selommes','Mer','Orléans'],['Montoire','Vendôme','Blois','Romorantin'],['Tours','Amboise','Blois','Mer']];
const HITS=[['Le Mans','2 agences immobilières'],['Saint-Calais','1 pizzeria'],['Vendôme','3 pizzerias · 2 écoles'],['Blois','1 office de tourisme'],['Châteaudun','1 pizzeria']];
const metro=pts=>{let d=`M${pts[0][0]} ${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[x0,y0]=pts[i-1],[x1,y1]=pts[i];const dx=x1-x0,dy=y1-y0,m=Math.min(Math.abs(dx),Math.abs(dy));d+=` L${(x0+Math.sign(dx)*m).toFixed(1)} ${(y0+Math.sign(dy)*m).toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)}`}return d};
let s='';
LINES.forEach((cs,i)=>{s+=`<path class="line" d="${metro(cs.map(P))}" fill="none" stroke="#A8C2FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:${i*.18}s"/>`});
[...new Set(LINES.flat())].forEach((c,i)=>{const[x,y]=P(c);const big=c==='Vendôme';const below=['Tours','Romorantin','Amboise','Mer','Blois','Château-Renault'].includes(c);
 s+=`<circle class="st" cx="${x}" cy="${y}" r="${big?15:9}" fill="#fff" stroke="${big?'#1E5EFF':'#7FA4FF'}" stroke-width="${big?6:4}" style="animation-delay:${.9+i*.05}s"/>`;
 s+=`<text class="lbl" font-family="Manrope,sans-serif" font-size="${big?19:15}" font-weight="${big?800:600}" fill="${big?'#0E1A33':'#5E6A85'}" x="${x+(big?20:14)}" y="${below?y+24:y-12}" style="animation-delay:${1.1+i*.05}s">${c}</text>`});
$('#mapg').innerHTML=s;
$('#hits').innerHTML=HITS.map(([c,t],i)=>{const[x,y]=P(c);const w=t.length*7.4+26;const left=c==='Châteaudun';const ox=x+(left?-w-18:22),oy=y+(c==='Blois'?34:-58);return`<g class="hit" id="hit${i}"><line x1="${x}" y1="${y}" x2="${ox+(left?w:0)}" y2="${oy+16}" stroke="#7FA4FF" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="${ox}" y="${oy}" width="${w}" height="32" rx="16" fill="#1E5EFF"/><text x="${ox+13}" y="${oy+21}" style="font:700 13px Manrope,sans-serif" fill="#fff">${t}</text></g>`}).join('');
function setLens(x,y,r){['#lensc','#lensbg','#lensring'].forEach(q=>{$(q).setAttribute('cx',x);$(q).setAttribute('cy',y);$(q).setAttribute('r',r)});
 $('#lensuse').setAttribute('transform',`translate(${x} ${y}) scale(2.2) translate(${-x} ${-y})`);
 const k=Math.max(0,60-(r-78)*.4),hx=x+r*.7071+4,hy=y+r*.7071+4;$('#lenshandle').setAttribute('x1',hx);$('#lenshandle').setAttribute('y1',hy);$('#lenshandle').setAttribute('x2',hx+k);$('#lenshandle').setAttribute('y2',hy+k)}
let raf,done=false;
function finish(){if(done)return;done=true;cancelAnimationFrame(raf);$('#lens').style.opacity=0;$('#mapg').style.display='none';$('#hits').style.display='none';$('#eraser').setAttribute('r',1250);$('#word').classList.add('on');$('#sub').classList.add('on');
 // recadre sur le logo : plus grand, et le texte remonte juste dessous
 const sv=$('svg'),A=[0,0,1000,620],B=[120,150,760,250],t0=performance.now();
 const vb=now=>{const t=Math.min(1,(now-t0)/700),e=1-Math.pow(1-t,3);sv.setAttribute('viewBox',A.map((v,i)=>v+(B[i]-v)*e).join(' '));if(t<1)requestAnimationFrame(vb)};requestAnimationFrame(vb)}
$('#stage').addEventListener('click',finish);
if(matchMedia('(prefers-reduced-motion: reduce)').matches){finish();return}
const path=[...HITS.map(h=>P(h[0])),P('Vendôme')];
setTimeout(()=>{if(done)return;$('#lens').style.opacity=1;const pts=[[path[0][0]-160,path[0][1]+120],...path],t0=performance.now(),seg=520;
 const step=now=>{if(done)return;const t=Math.max(0,(now-t0)/seg),i=Math.min(Math.floor(t),pts.length-2),f=Math.min(1,t-i),e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;
  const x=pts[i][0]+(pts[i+1][0]-pts[i][0])*e,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*e;setLens(x,y,78);
  if(f>.85&&i<HITS.length)$('#hit'+i).classList.add('on');
  if(t<pts.length-1)raf=requestAnimationFrame(step);else toLogo(x,y)};
 raf=requestAnimationFrame(step)},1900);
function toLogo(x,y){$('#hits').style.transition='opacity .4s';$('#hits').style.opacity=0;const t0=performance.now();
 const mv=now=>{if(done)return;const t=Math.min(1,(now-t0)/650),e=1-Math.pow(1-t,3);setLens(x+(500-x)*e,y+(216-y)*e,78-42*e);if(t<1)raf=requestAnimationFrame(mv);else erase()};raf=requestAnimationFrame(mv)}
function erase(){$('#lens').style.opacity=0;$('#word').classList.add('on');const t1=performance.now();
 const er=now=>{if(done)return;const t=Math.min(1,(now-t1)/850),e=1-Math.pow(1-t,3);$('#eraser').setAttribute('r',e*1250);if(t<1)raf=requestAnimationFrame(er);else{$('#sub').classList.add('on');finish()}};raf=requestAnimationFrame(er)}
})();
</script>
</body>
</html>
